name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter hugeicons-animated-vue build
      - name: Publish
        working-directory: packages/vue
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if npm view "hugeicons-animated-vue@${CURRENT}" version >/dev/null 2>&1; then
            echo "hugeicons-animated-vue@${CURRENT} is already on npm."
          else
            npm publish --access public --provenance \
              || echo "publish failed; the version may still be staged"
          fi
      - name: Point latest at this version
        working-directory: packages/vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          for _ in $(seq 1 16); do
            if npm view "hugeicons-animated-vue@${CURRENT}" version >/dev/null 2>&1; then
              npm dist-tag add "hugeicons-animated-vue@${CURRENT}" latest
              npm view hugeicons-animated-vue dist-tags --json
              exit 0
            fi
            echo "waiting for ${CURRENT} to become installable"
            sleep 30
          done
          echo "${CURRENT} never became installable"
          exit 1
      - name: Attach package tarball
        working-directory: packages/vue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          TARBALL="$(npm pack | tail -n1)"
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG:-v$CURRENT}"
          gh release upload "$TAG" "$TARBALL" --clobber
