name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter hugeicons-animated-vue build
      - name: Publish
        working-directory: packages/vue
        run: |
          CURRENT="$(node -p "require('./package.json').version")"
          if npm view "hugeicons-animated-vue@${CURRENT}" version >/dev/null 2>&1; then
            echo "hugeicons-animated-vue@${CURRENT} is already on npm."
            exit 0
          fi
          npm publish --access public --provenance
