name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter hugeicons-animated-vue build
      - name: Publish
        working-directory: packages/vue
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            echo "Add a granular npm token as the NPM_TOKEN repository secret, or publish locally with npm login."
            exit 0
          fi
          CURRENT="$(node -p "require('./package.json').version")"
          if npm view "hugeicons-animated-vue@${CURRENT}" version >/dev/null 2>&1; then
            echo "hugeicons-animated-vue@${CURRENT} is already on npm."
            exit 0
          fi
          pnpm publish --access public --no-git-checks
