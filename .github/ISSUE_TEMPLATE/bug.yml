name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Security issues go through [SECURITY.md](../SECURITY.md), not here.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import Notification03Icon
        2. Hover / call startAnimation()
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: Icon name
      description: Filename without extension, e.g. `notification-03`. Leave blank if not icon-specific.
      placeholder: notification-03
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        - hugeicons-animated-vue:
        - vue:
        - motion-v:
        - browser / OS:
    validations:
      required: true
  - type: checkboxes
    id: reduced
    attributes:
      label: Reduced motion
      options:
        - label: `prefers-reduced-motion: reduce` is enabled
